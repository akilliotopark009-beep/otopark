<!DOCTYPE html>
<html>
<head>
    <title>Akıllı Otopark</title>
    <meta charset="UTF-8">
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; padding-top: 50px; }
        .sayi { font-size: 150px; color: cyan; }
        .bos { font-size: 40px; color: lightgreen; }
    </style>
</head>
<body>
    <h1>🚗 OTOPARK DURUMU</h1>
    <div class="sayi" id="aracSayisi">...</div>
    <p>Şu an içerideki araç sayısı</p>
    <div class="bos" id="bosYer">...</div>
    <p>Boş yer</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://otopark-28cc4-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'arac'), (snapshot) => {
            const sayi = snapshot.val();
            document.getElementById('aracSayisi').innerText = sayi;
            document.getElementById('bosYer').innerText = (4 - sayi) + " boş yer var";
        });
    </script>
</body>
</html>
